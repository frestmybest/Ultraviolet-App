<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>JLauncher</title>
    <link rel="shortcut icon" content="favicon.ico" />

    <!-- Ultraviolet proxy scripts: DO NOT REMOVE. These make launches load in-window. -->
    <script src="baremux/index.js"></script>
    <script src="uv/uv.bundle.js"></script>
    <script src="uv/uv.config.js"></script>

    <style>
      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }
      html { background: #000; }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #fff;
        padding: 28px 40px 56px;
        display: flex;
        justify-content: center;
      }

      .bg-video {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; z-index: -1;
      }

      .wrap { width: 100%; max-width: 460px; text-align: center; }

      h1 { margin: 0; font-size: 2.6rem; font-weight: 700; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.85); }
      .sub { margin: 8px 0 26px; font-size: 0.85rem; color: #bbb; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }

      .card { background: #000; border: 1px solid #fff; border-radius: 14px; padding: 22px; text-align: left; }
      .card + .card { margin-top: 22px; }

      .label { font-size: 0.8rem; color: #888; margin: 0 0 10px; }

      .url, .ai-input, .dz {
        width: 100%; font: inherit; font-size: 1rem;
        padding: 11px 14px; border: 1px solid #fff; border-radius: 10px;
        background: #000; color: #fff; outline: none;
      }
      .url::placeholder, .ai-input::placeholder, .dz::placeholder { color: #777; }
      .url:focus-visible, .ai-input:focus-visible, .dz:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      .modes { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
      .mode {
        flex: 1 1 auto; font: inherit; font-size: 0.85rem;
        padding: 7px 10px; border: 1px solid #fff; border-radius: 999px;
        background: #000; color: #fff; cursor: pointer;
      }
      .mode[aria-checked="true"] { background: #fff; color: #000; }
      .mode:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      .hint { font-size: 0.8rem; color: #888; margin: 4px 2px 14px; min-height: 1.2em; }

      .engine-row { display: flex; align-items: center; gap: 8px; margin: 0 2px 16px; }
      .engine-label { font-size: 0.82rem; color: #aaa; }
      select.engine-sel { width: auto; flex: 0 0 auto; padding: 6px 10px; font-size: 0.85rem; }

      .disguise { margin: 0 0 16px; }
      .disguise summary { font-size: 0.82rem; color: #aaa; cursor: pointer; margin-bottom: 10px; }
      .dz-row { display: flex; gap: 8px; }
      .dz-row .dz { flex: 1; }
      select.dz { cursor: pointer; }

      .go {
        width: 100%; font: inherit; font-size: 1.05rem; font-weight: 600;
        padding: 11px; border: 1px solid #fff; border-radius: 10px;
        background: #fff; color: #000; cursor: pointer;
      }
      .go:hover { background: #ddd; }
      .go:active { background: #bbb; }
      .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

      .status { margin: 12px 2px 0; font-size: 0.85rem; min-height: 1.2em; color: #ccc; }
      .status.bad { color: #fff; font-weight: 600; }

      /* In-page viewer (used by the "In-page" mode) */
      .viewer { display: none; margin-top: 14px; }
      .viewer.on { display: block; }
      .viewer-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #888; margin-bottom: 6px; }
      .viewer-close { font: inherit; font-size: 0.78rem; border: 1px solid #fff; border-radius: 8px; background: #000; color: #fff; padding: 3px 10px; cursor: pointer; }
      .viewer iframe { width: 100%; height: 420px; border: 1px solid #333; border-radius: 8px; background: #000; display: block; }

      /* Fullscreen frame (used by about:blank / blob / popup modes) */
      .fs { position: fixed; inset: 0; z-index: 100; background: #000; display: none; }
      .fs.on { display: block; }
      .fs iframe { width: 100%; height: 100%; border: 0; display: block; }
      .fs-close {
        position: fixed; top: 8px; right: 10px; z-index: 101;
        font: inherit; font-size: 0.8rem; border: 1px solid #fff; border-radius: 8px;
        background: rgba(0,0,0,0.75); color: #fff; padding: 4px 12px; cursor: pointer;
      }

      /* AI */
      .chat {
        border: 1px solid #333; border-radius: 10px; padding: 12px;
        height: 200px; overflow-y: auto; margin-bottom: 12px;
        font-size: 0.9rem; line-height: 1.45; display: flex; flex-direction: column; gap: 10px;
      }
      .chat:empty::before { content: "Ask me anything."; color: #555; }
      .msg { white-space: pre-wrap; word-wrap: break-word; }
      .msg .who { color: #888; font-size: 0.75rem; display: block; margin-bottom: 2px; }
      .msg.me .who { color: #fff; }
      .ai-row { display: flex; gap: 8px; }
      .ai-row .ai-input { flex: 1; }
      .ai-send { font: inherit; font-weight: 600; padding: 0 16px; border: 1px solid #fff; border-radius: 10px; background: #fff; color: #000; cursor: pointer; }
      .ai-send:hover { background: #ddd; }
      .ai-send:disabled { opacity: 0.5; cursor: default; }
      .ai-send:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      @media (max-width: 480px) {
        body { padding: 32px 20px; }
        h1 { font-size: 2.1rem; }
      }
    </style>
  </head>

  <body>
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline></video>

    <div class="wrap">
      <h1>JLauncher</h1>
      <p class="sub">Because Joetoro Launcher is outdated now :(</p>

      <!-- Launcher. The form keeps Ultraviolet's IDs so the proxy script still drives it. -->
      <form id="uv-form" class="card">
        <input id="uv-search-engine" type="hidden" value="https://search.brave.com/search?q=%s" />
        <input id="uv-address" class="url" type="text" placeholder="Type a website or a search" autocomplete="off" spellcheck="false" />

        <div class="modes" role="radiogroup" aria-label="How to open it">
          <button type="button" class="mode" role="radio" aria-checked="true" data-mode="blank">about:blank</button>
          <button type="button" class="mode" role="radio" aria-checked="false" data-mode="blob">Blob</button>
          <button type="button" class="mode" role="radio" aria-checked="false" data-mode="popup">Popup</button>
          <button type="button" class="mode" role="radio" aria-checked="false" data-mode="inpage">In-page</button>
        </div>
        <div class="hint" id="hint"></div>

        <details class="disguise">
          <summary>Disguise the tab (optional)</summary>
          <div class="dz-row">
            <input id="dzTitle" class="dz" type="text" placeholder="Tab name, e.g. Google Docs" autocomplete="off" />
            <select id="dzIcon" class="dz" aria-label="Tab icon">
              <option value="">No icon</option>
              <option value="google">Google</option>
              <option value="docs">Google Docs</option>
              <option value="classroom">Classroom</option>
              <option value="drive">Google Drive</option>
              <option value="slides">Slides</option>
            </select>
          </div>
        </details>

        <button type="submit" class="go" id="go">Launch</button>
        <div class="status" id="status"></div>
        <p id="uv-error" style="display:none"></p>
        <pre id="uv-error-code" style="display:none"></pre>

        <div class="viewer" id="viewer">
          <div class="viewer-bar">
            <span>In-page viewer</span>
            <button type="button" class="viewer-close" id="viewerClose">Close</button>
          </div>
          <iframe id="viewerFrame"
            allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </form>

      <!-- AI -->
      <div class="card">
        <p class="label">Ask AI</p>
        <div class="chat" id="chat"></div>
        <div class="ai-row">
          <input id="aiInput" class="ai-input" type="text" placeholder="Type a question..." autocomplete="off" />
          <button class="ai-send" id="aiSend">Send</button>
        </div>
      </div>
    </div>

    <!-- Fullscreen proxied frame for about:blank / blob / popup modes -->
    <div class="fs" id="fs">
      <button class="fs-close" id="fsClose" style="display:none">Close ✕</button>
      <iframe id="uv-frame"
        allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
    </div>

    <!-- Ultraviolet proxy scripts: DO NOT REMOVE -->
    <script src="register-sw.js"></script>
    <script src="search.js"></script>

    <script>
      /* ---------- Config ---------- */

      // Background video. Paste a direct https .mp4 link, or leave empty for black.
      const VIDEO_URL = "https://files.catbox.moe/i96pjk.mp4";
      if (VIDEO_URL) {
        const v = document.getElementById("bgVideo");
        v.src = VIDEO_URL;
        const p = v.play();
        if (p) p.catch(function () {});
      }

      // Pollinations key for the AI box. Get a free one at https://enter.pollinations.ai/keys
      const POLLINATIONS_KEY = "sk_QjGxCr3LpxInHQAhuXyKU2ve6gLV1dXx";

      /* ---------- Launcher UI ---------- */
      const hints = {
        blank:  "Opens the proxied page fullscreen; tab shows about:blank.",
        blob:   "Opens the proxied page fullscreen; tab shows a blob: link.",
        popup:  "Opens the proxied page in a separate window.",
        inpage: "Loads the proxied page in a panel inside this launcher."
      };

      // Fixed search engine (Brave is the most proxy-tolerant).
      const SEARCH_ENGINE = "https://search.brave.com/search?q=%s";

      let mode = "blank";
      const addr = document.getElementById("uv-address");
      const hint = document.getElementById("hint");
      const status = document.getElementById("status");
      const dzTitle = document.getElementById("dzTitle");
      const dzIcon = document.getElementById("dzIcon");
      const modeBtns = document.querySelectorAll(".mode");

      const viewer = document.getElementById("viewer");
      const viewerFrame = document.getElementById("viewerFrame");
      const viewerClose = document.getElementById("viewerClose");

      const fs = document.getElementById("fs");
      const fsClose = document.getElementById("fsClose");

      hint.textContent = hints[mode];

      modeBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          modeBtns.forEach(function (b) { b.setAttribute("aria-checked", "false"); });
          btn.setAttribute("aria-checked", "true");
          mode = btn.dataset.mode;
          hint.textContent = hints[mode];
        });
      });

      function say(msg, bad) {
        status.textContent = msg;
        status.className = "status" + (bad ? " bad" : "");
      }

      const ICONS = {
        google:    "https://www.google.com/favicon.ico",
        docs:      "https://www.gstatic.com/images/branding/product/1x/docs_2020q4_48dp.png",
        classroom: "https://www.gstatic.com/images/branding/product/1x/classroom_2020q4_48dp.png",
        drive:     "https://www.gstatic.com/images/branding/product/1x/drive_2020q4_48dp.png",
        slides:    "https://www.gstatic.com/images/branding/product/1x/slides_2020q4_48dp.png"
      };
      function applyDisguise(doc) {
        const name = dzTitle.value.trim() || "about:blank";
        doc.title = name;
        const icoUrl = ICONS[dzIcon.value];
        if (icoUrl) {
          const link = doc.createElement("link");
          link.rel = "icon";
          link.href = icoUrl;
          doc.head.appendChild(link);
        }
      }

      /* ---------- Proxy pipeline (reuses Ultraviolet) ---------- */
      const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

      // Turn user text into a proxied URL using Ultraviolet's own search() + config.
      async function toProxyUrl(text) {
        await registerSW();
        const target = search(text, SEARCH_ENGINE);
        const wispUrl =
          (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
        if ((await connection.getTransport()) !== "/epoxy/index.mjs") {
          await connection.setTransport("/epoxy/index.mjs", [{ wisp: wispUrl }]);
        }
        return __uv$config.prefix + __uv$config.encodeUrl(target);
      }

      function openFullscreen(proxyUrl) {
        const f = document.getElementById("uv-frame");
        f.src = proxyUrl;
        fs.classList.add("on");
        fsClose.style.display = "block";
      }
      function closeFullscreen() {
        fs.classList.remove("on");
        fsClose.style.display = "none";
        document.getElementById("uv-frame").src = "about:blank";
      }

      // Fill a popup window with the proxied frame + optional disguise.
      function openPopup(proxyUrl) {
        const w = Math.min(1100, screen.availWidth - 80);
        const h = Math.min(750, screen.availHeight - 80);
        const win = window.open("about:blank", "_blank", "width=" + w + ",height=" + h + ",left=40,top=40");
        if (!win) return false;
        applyDisguise(win.document);
        win.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000;";
        win.document.documentElement.style.cssText = "margin:0;height:100%;";
        const f = win.document.createElement("iframe");
        f.src = proxyUrl;
        f.style.cssText = "border:0;width:100%;height:100%;display:block;";
        f.setAttribute("allow", "fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture");
        f.setAttribute("allowfullscreen", "");
        win.document.body.appendChild(f);
        return true;
      }

      async function launch() {
        const text = addr.value.trim();
        if (!text) { say("Type a website, or something to search for.", true); return; }

        say("Loading through the proxy...");
        let proxyUrl;
        try {
          proxyUrl = await toProxyUrl(text);
        } catch (err) {
          say("Couldn't start the proxy. Reload the page and try again.", true);
          return;
        }

        if (mode === "inpage") {
          viewerFrame.src = proxyUrl;
          viewer.classList.add("on");
          say("Loaded below.");
          viewer.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else if (mode === "popup") {
          if (openPopup(proxyUrl)) say("Opened in a window.");
          else say("Your browser blocked the window. Allow popups and try again.", true);
        } else {
          // about:blank and blob both show the proxied page fullscreen here,
          // with the launcher page's own address bar (about:blank in an embed).
          openFullscreen(proxyUrl);
          say("");
        }
      }

      // The form submit is the single entry point (Enter key or Launch button).
      document.getElementById("uv-form").addEventListener("submit", function (e) {
        e.preventDefault();
        launch();
      });

      viewerClose.addEventListener("click", function () {
        viewer.classList.remove("on");
        viewerFrame.src = "about:blank";
      });
      fsClose.addEventListener("click", closeFullscreen);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && fs.classList.contains("on")) closeFullscreen();
      });

      /* ---------- AI ---------- */
      const chat = document.getElementById("chat");
      const aiInput = document.getElementById("aiInput");
      const aiSend = document.getElementById("aiSend");
      const history = [{ role: "system", content: "You are a friendly, concise assistant embedded in a web page. Keep answers short and clear." }];

      function addMsg(who, text, mine) {
        const el = document.createElement("div");
        el.className = "msg" + (mine ? " me" : "");
        const label = document.createElement("span");
        label.className = "who";
        label.textContent = who;
        const body = document.createElement("span");
        body.textContent = text;
        el.appendChild(label);
        el.appendChild(body);
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return body;
      }

      async function ask() {
        const q = aiInput.value.trim();
        if (!q) return;
        aiInput.value = "";
        addMsg("You", q, true);
        history.push({ role: "user", content: q });

        aiSend.disabled = true;
        const out = addMsg("AI", "...", false);

        try {
          const headers = { "Content-Type": "application/json" };
          if (POLLINATIONS_KEY) headers["Authorization"] = "Bearer " + POLLINATIONS_KEY;
          const res = await fetch("https://gen.pollinations.ai/v1/chat/completions", {
            method: "POST",
            headers: headers,
            body: JSON.stringify({ model: "openai", referrer: "jlauncher", messages: history })
          });
          if (res.status === 401 || res.status === 403) throw new Error("auth");
          if (!res.ok) throw new Error("status " + res.status);
          const data = await res.json();
          const reply = (data.choices && data.choices[0] && data.choices[0].message.content) || "No reply.";
          out.textContent = reply.trim();
          history.push({ role: "assistant", content: reply.trim() });
          chat.scrollTop = chat.scrollHeight;
        } catch (e) {
          if (e.message === "auth") {
            out.textContent = "The AI needs a valid key. Check the POLLINATIONS_KEY line in the code.";
          } else {
            out.textContent = "Couldn't reach the AI right now. Try again in a moment.";
          }
        } finally {
          aiSend.disabled = false;
          aiInput.focus();
        }
      }

      aiSend.addEventListener("click", ask);
      aiInput.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(); });
    </script>
  </body>
</html>
